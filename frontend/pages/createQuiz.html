<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create a New Quiz | Quizzer</title>
    <link rel="stylesheet" href="../css/createQuiz.css" />
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <img src="../images/logo.jpg" alt="Logo" class="logo" />
            <h2>Quizzer</h2>
        </div>
        <div class="nav-right">
            <a href="/home" class="nav-link">Home</a>
            <a href="/leaderboard" class="nav-link">Leaderboard</a>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <main class="main-container">
        <div class="content-header">
            <h2>📝 Create Your Quiz</h2>
            <p>Fill in the details below. You'll add questions on the next step.</p>
        </div>

        <form id="createQuizForm">
            <div class="form-group">
                <label for="quizName">Quiz Name</label>
                <input type="text" id="quizName" placeholder="e.g., General Knowledge Challenge" required />
            </div>

            <div class="form-group">
                <label for="quizDesc">Description</label>
                <textarea id="quizDesc" placeholder="Describe what your quiz is about..."></textarea>
            </div>

            <div class="private-toggle">
                <input type="checkbox" id="isPrivate" />
                <label for="isPrivate">Make this quiz private (requires a password to join)</label>
            </div>

            <div class="form-group">
                <input type="password" id="quizPassword" placeholder="Enter a password for the quiz" />
            </div>
            
            <button type="submit" class="submit-btn">Create Quiz & Add Questions</button>
        </form>
    </main>

    <script src="../js/createQuiz.js"></script>
</body>
</html>
