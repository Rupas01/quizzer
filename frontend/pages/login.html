<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login / Signup | Quizzer</title>
  <link rel="stylesheet" href="../css/login.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-left">
      <h1>Welcome to <span>Quizzer</span></h1>
      <p>Join a world of interactive learning — create your own quizzes or test your knowledge by taking one.</p>
      <button id="goHomeBtn">← Back to Home</button>
    </div>

    <div class="auth-right">
      <div class="form-toggle">
        <button id="loginToggle" class="active">Login</button>
        <button id="signupToggle">Signup</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="auth-form">
        <h2>Welcome Back 👋</h2>
        <input type="text" id="login-username" placeholder="Username" required />
        <input type="password" id="login-password" placeholder="Password" required />
        <button type="submit">Login</button>
        <!-- <p class="note">New here? Click “Signup” above to create your account.</p> -->
      </form>

      <!-- SIGNUP FORM -->
      <form id="signupForm" class="auth-form hidden">
        <h2>Join Quizzer 🚀</h2>
        <input type="text" id="signup-username" placeholder="Choose a username" required />
        <input type="email" id="signup-email" placeholder="Email address" required />
        <input type="password" id="signup-password" placeholder="Create password" required />

        <button type="submit">Create Account</button>
        <!-- <p class="note">Already have an account? Click “Login” above.</p> -->
      </form>
    </div>
  </div>

  <script src="../js/login.js"></script>
</body>
</html>
